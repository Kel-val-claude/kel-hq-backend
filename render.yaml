# ============================================
#   RENDER DEPLOYMENT BLUEPRINT
#   Place this file at the ROOT of your GitHub repo.
#
#   If your repo root IS this kel-hq-backend-v2 folder
#   (i.e. you pushed this folder's contents directly),
#   keep rootDir commented out below.
#
#   If your repo contains kel-hq-backend-v2/ as a
#   subfolder, uncomment rootDir.
# ============================================

databases:
  - name: kel-hq-db
    plan: free
    databaseName: kel_hq
    user: kel_hq_user

services:
  - type: web
    name: kel-hq
    runtime: python
    plan: free
    # rootDir: kel-hq-backend-v2   # ← uncomment if backend is a subfolder of your repo
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app.main:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: kel-hq-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"
